<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pearl's Rhyme Machine</title>
  <style>
    :root { color-scheme: light; --ink:#201938; --muted:#6e6681; --purple:#7255d9; --pink:#f15e9d; --line:#ded5ef; }
    * { box-sizing: border-box; }
    body { min-height:100vh; margin:0; padding:28px 18px; display:grid; place-items:center; font-family:Inter,ui-rounded,system-ui,sans-serif; color:var(--ink); background:radial-gradient(circle at 15% 15%,#ffd8e7 0,transparent 32%),radial-gradient(circle at 85% 80%,#dcd4ff 0,transparent 34%),#f7f3ff; }
    main { width:min(620px,100%); padding:clamp(28px,6vw,54px); text-align:center; background:rgba(255,255,255,.9); border:1px solid #fff; border-radius:30px; box-shadow:0 24px 70px rgba(65,44,102,.16); backdrop-filter:blur(14px); }
    .pearl { width:72px; height:72px; margin:0 auto 18px; display:grid; place-items:center; font-size:36px; background:linear-gradient(145deg,#fff,#eadfff); border:2px solid #fff; border-radius:50%; box-shadow:0 10px 25px rgba(114,85,217,.2); }
    h1 { margin:0; font-size:clamp(2rem,8vw,3.4rem); letter-spacing:-.055em; } h1 span { color:var(--purple); }
    .intro { margin:12px auto 28px; color:var(--muted); line-height:1.55; }
    form { display:flex; gap:10px; } input,button { font:inherit; }
    input { min-width:0; flex:1; padding:15px 18px; color:var(--ink); background:#fffaf4; border:2px solid var(--line); border-radius:15px; outline:none; }
    input:focus { border-color:var(--purple); box-shadow:0 0 0 4px #e8e2ff; }
    button { padding:15px 22px; font-weight:750; color:#fff; background:linear-gradient(135deg,var(--purple),var(--pink)); border:0; border-radius:15px; cursor:pointer; box-shadow:0 8px 18px rgba(114,85,217,.25); }
    button:hover { transform:translateY(-1px); } button:disabled { opacity:.65; cursor:wait; transform:none; }
    #results { min-height:118px; margin-top:24px; padding:22px; display:grid; place-items:center; border:2px dashed var(--line); border-radius:20px; }
    #results.empty { color:var(--muted); } #results.answer { background:#fbf9ff; border-style:solid; } #results.poop { font-size:4.5rem; background:#fff7e9; border-style:solid; }
    .rhyme { margin:0 0 12px; color:var(--muted); } .rhyme strong { color:var(--purple); font-size:1.35rem; } .artist { margin:0 0 10px; color:var(--muted); font-size:.95rem; font-weight:750; }
    blockquote { margin:0; font-size:1.25rem; font-weight:700; line-height:1.45; } .youtube { display:inline-block; margin-top:16px; color:var(--purple); font-weight:750; } .error { color:#a52e58 !important; }
    @media (max-width:520px) { form { flex-direction:column; } button { width:100%; } }
  </style>
</head>
<body>
  <main>
    <div class="pearl" aria-hidden="true">🤖</div>
    <h1><span>Pearl's</span> Rhyme Machine</h1>
    <p class="intro">Give Pearl a word. Consonants get a rhyme and a tiny original song lyric. Vowels get… something else.</p>
    <form id="rhymeForm">
      <input id="wordInput" type="text" placeholder="Try “bright”" autocomplete="off" aria-label="Word to rhyme" required>
      <button id="submitButton" type="submit">Make it rhyme</button>
    </form>
    <section id="results" class="empty" aria-live="polite">Pearl is listening 🎧</section>
  </main>
  <script>
    const form=document.querySelector('#rhymeForm');
    const input=document.querySelector('#wordInput');
    const button=document.querySelector('#submitButton');
    const results=document.querySelector('#results');
    const lastLetter=word=>word.toLowerCase().match(/[a-z]$/)?.[0]||'';
    const bandAdjectives=['Chromatic','Electric','Velvet','Neon','Cosmic','Midnight','Glitter','Turbo'];
    const bandNouns=['Pancakes','Comets','Bananas','Kazoos','Jellybeans','Moonbeams','Waffles','Trombones'];
    const youtubeSearches=['otters juggling','tiny train through snow','synthwave cooking show','moonwalk tutorial','goats in sweaters','underwater disco'];
    const randomItem=items=>items[Math.floor(Math.random()*items.length)];
    async function makeFallbackRhyme(word){
      const query=new URLSearchParams({rel_rhy:word,max:'50'});
      const response=await fetch(`https://api.datamuse.com/words?${query}`);
      if(!response.ok) throw new Error('Pearl could not find a rhyme right now.');
      const matches=await response.json();
      const rhyme=matches.find(match=>
        typeof match.word==='string'&&
        match.word.toLowerCase()!==word.toLowerCase()&&
        /^[a-z]+(?:[ '-][a-z]+)*$/i.test(match.word)
      )?.word;
      if(!rhyme) throw new Error('Pearl could not find a rhyme for that word.');
      const youtubeUrl=`https://www.youtube.com/results?${new URLSearchParams({search_query:randomItem(youtubeSearches)})}`;
      return {
        rhyme,
        lyric:`Pearl paired ${word} with ${rhyme}; your flow needs a tune-up, but she calls it a chart-topper!`,
        bandName:`The ${randomItem(bandAdjectives)} ${randomItem(bandNouns)}`,
        youtubeUrl
      };
    }
    form.addEventListener('submit',async event=>{
      event.preventDefault();
      const word=input.value.trim();
      const ending=lastLetter(word);
      if(!ending){ results.className='empty error'; results.textContent='Please enter a word that ends with a letter.'; return; }
      if('aeiou'.includes(ending)){ results.className='poop'; results.textContent='💩'; return; }

      button.disabled=true; button.textContent='Pearl is writing…';
      results.className='empty'; results.textContent='Finding Pearl’s flow…';
      try{
        const data=await makeFallbackRhyme(word);
        results.className='answer'; results.replaceChildren();
        const wrapper=document.createElement('div');
        const rhyme=document.createElement('p'); rhyme.className='rhyme'; rhyme.append(`A rhyme for “${word}”: `);
        const strong=document.createElement('strong'); strong.textContent=data.rhyme; rhyme.append(strong);
        const artist=document.createElement('p'); artist.className='artist'; artist.textContent=`Performed by ${data.bandName}`;
        const lyric=document.createElement('blockquote'); lyric.textContent=`“${data.lyric}”`;
        const youtube=document.createElement('a'); youtube.className='youtube'; youtube.href=data.youtubeUrl; youtube.target='_blank'; youtube.rel='noopener noreferrer'; youtube.textContent='Find Pearl’s YouTube soundtrack';
        wrapper.append(rhyme,artist,lyric,youtube); results.append(wrapper);
      }catch(error){ results.className='empty error'; results.textContent=error.message; }
      finally{ button.disabled=false; button.textContent='Make it rhyme'; }
    });
  </script>
</body>
</html>
